# Weekly dependency updates, grouped so they arrive as a few PRs (item 108).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      supabase:
        patterns: ["@supabase/*", "supabase"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major upgrades are done deliberately, not by bot.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR a month for all workflow actions, not one per action.
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The image stays on the current Node LTS (22); odd-numbered Node
      # releases are short-lived. Move to the next LTS deliberately.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
