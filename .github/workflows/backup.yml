# Weekly backup (item 84): a full database dump every Monday, plus all stored
# files (PDFs, Word files, covers, manuscripts) on the first Monday of each
# month. Each archive goes only to Google Drive: never to a workflow artifact,
# which anyone could download from a public repository, and the dump holds
# every account's password hash. The result is reported to the site, which
# alerts the Super Admin if no backup succeeds for a week. Until the secrets
# below are added, each run skips with a notice instead of failing.
# Repository secrets:
#   SUPABASE_DB_URL         Supabase → Connect → Session pooler connection string (with password)
#   SUPABASE_URL            https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN (docs/RUNBOOK.md, "Set up backups")
#   SITE_URL, CRON_SECRET   to report the result
# Restore: docs/RUNBOOK.md, "Restore from a backup".
name: Backup

on:
  schedule:
    - cron: "40 2 * * 1"
  workflow_dispatch:
    inputs:
      include_files:
        description: "Also back up stored files"
        type: boolean
        default: false

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      # Not set up yet (no SUPABASE_DB_URL): skip with a notice, like
      # scheduled.yml, so no failure email arrives every week. Half set up:
      # fail, naming what is missing.
      - name: Check the secrets
        id: check
        run: |
          missing=""
          for name in SUPABASE_DB_URL NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY \
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::Backups are not set up yet (docs/RUNBOOK.md, \"Set up backups\"); skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            # NEXT_PUBLIC_SUPABASE_URL is the SUPABASE_URL secret.
            echo "::error::Missing repository secrets:${missing/NEXT_PUBLIC_SUPABASE_URL/SUPABASE_URL}"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.ready == 'true'
        run: npm ci --omit=dev --ignore-scripts
      - if: steps.check.outputs.ready == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Dump the database
        id: db
        if: steps.check.outputs.ready == 'true'
        run: |
          stamp=$(date -u +%Y-%m-%d)
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          # schema.sql is for reference; restores rebuild the schema from the migrations (RUNBOOK).
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          # Two internal Storage tables can't be written by the postgres role on restore; they hold nothing of ours.
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only \
            -x storage.buckets_vectors -x storage.vector_indexes
          # The list of stored files every week; the files themselves monthly (next step).
          node scripts/backup-storage.mjs backup/files --list-only
          latest=$(ls supabase/migrations | tail -1)
          printf '{"date":"%s","commit":"%s","latest_migration":"%s"}\n' "$stamp" "$GITHUB_SHA" "$latest" > backup/meta.json
          grep -q 'COPY "public"."articles"' backup/data.sql || { echo "::error::The dump has no articles table"; exit 1; }
          tar -czf "awlel-db-$stamp.tar.gz" -C backup .
          echo "file=awlel-db-$stamp.tar.gz" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s awlel-db-$stamp.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Back up stored files (first Monday of the month, or on request)
        id: files
        if: ${{ steps.check.outputs.ready == 'true' && (inputs.include_files || github.event_name == 'schedule') }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%d)" -gt 7 ]; then
            echo "Not the first week of the month; skipping files."; exit 0
          fi
          stamp=$(date -u +%Y-%m-%d)
          node scripts/backup-storage.mjs files
          tar -czf "awlel-files-$stamp.tar.gz" -C files .
          echo "file=awlel-files-$stamp.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Copy to Google Drive
        if: steps.check.outputs.ready == 'true'
        run: |
          node scripts/upload-to-drive.mjs "${{ steps.db.outputs.file }}" --keep 12 --prefix awlel-db-
          if [ -n "${{ steps.files.outputs.file }}" ]; then
            node scripts/upload-to-drive.mjs "${{ steps.files.outputs.file }}" --keep 3 --prefix awlel-files-
          fi

      # The site must answer 2xx itself: a redirect (for example from the bare
      # domain to www) would otherwise "succeed" without recording anything.
      - name: Report success to the site
        if: success() && steps.check.outputs.ready == 'true'
        run: |
          [ -n "$SITE_URL" ] && [ -n "$CRON_SECRET" ] || exit 0
          out=$(curl -sS -o response.txt -w '%{http_code} %{redirect_url}' --max-time 60 -X POST \
            "$SITE_URL/api/cron/heartbeat" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d "{\"task\":\"backup\",\"status\":\"succeeded\",\"detail\":{\"file\":\"${{ steps.db.outputs.file }}\",\"bytes\":${{ steps.db.outputs.size }},\"files_archive\":\"${{ steps.files.outputs.file }}\"}}") \
            || { echo "::error::Could not reach SITE_URL ($SITE_URL)."; exit 1; }
          code=${out%% *}; target=${out#* }
          cat response.txt; echo
          case "$code" in
            2??) ;;
            3??) echo "::error::SITE_URL redirects to ${target%%/api/*}; set SITE_URL to the exact address."; exit 1 ;;
            *) echo "::error::The site answered HTTP $code."; exit 1 ;;
          esac

      - name: Report failure to the site
        if: failure()
        run: |
          [ -n "$SITE_URL" ] && [ -n "$CRON_SECRET" ] || exit 0
          out=$(curl -sS -o response.txt -w '%{http_code} %{redirect_url}' --max-time 60 -X POST \
            "$SITE_URL/api/cron/heartbeat" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d "{\"task\":\"backup\",\"status\":\"failed\",\"error\":\"See GitHub Actions run ${{ github.run_id }}\"}") \
            || { echo "::error::Could not reach SITE_URL ($SITE_URL)."; exit 1; }
          code=${out%% *}; target=${out#* }
          case "$code" in
            2??) ;;
            3??) echo "::error::SITE_URL redirects to ${target%%/api/*}; set SITE_URL to the exact address."; exit 1 ;;
            *) echo "::error::The site answered HTTP $code."; exit 1 ;;
          esac
