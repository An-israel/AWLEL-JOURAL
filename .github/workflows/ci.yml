# CI on every pull request and push to main (item 6).
# Vercel's Git integration builds a preview per PR and deploys production on
# merge to main; database migrations are applied by migrate.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, types, unit tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # The one-paste setup file (docs/LAUNCH_GUIDE.md) must match the migrations and seed.
      - run: scripts/build-setup-sql.sh && git diff --exit-code supabase/setup
      - run: npm run typecheck
      - run: npm test
      # Fail on high/critical advisories in production dependencies (item 108).
      - run: npm audit --omit=dev --audit-level=high

  database:
    name: Migrations, RLS tests, rollbacks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start Supabase (database only)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,mailpit
      - name: Lint schema
        run: supabase db lint --level error
      - name: pgTAP tests (RLS, triggers)
        run: supabase test db
      - name: Rollbacks reverse cleanly
        run: bash scripts/check-rollbacks.sh
      - name: Generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code lib/supabase/database.types.ts || {
            echo "::error::lib/supabase/database.types.ts is stale. Run npm run db:types."; exit 1; }

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: npm ci
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Write .env.local from the local stack
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "METRICS_SALT=$(openssl rand -hex 24)"
            echo "CRON_SECRET=$(openssl rand -hex 24)"
            echo "LOG_LEVEL=warn"
            echo "SUPER_ADMIN_EMAIL=admin@awlel.local"
            echo "SUPER_ADMIN_PASSWORD=Ci-only-passw0rd-$(openssl rand -hex 4)"
            echo "SUPER_ADMIN_NAME=CI Super Admin"
          } > .env.local
      - name: Create the first Super Admin
        run: npm run seed:admin
      # Build cache for faster CI builds (item 107).
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key-not-a-secret
